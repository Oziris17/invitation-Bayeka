<main id="root"></main>
<script type="application/json" id="sd">{"meta":{"title":"Culte de mise en retraite — Pasteur Emmanuel Bayeka","desc":"Culte de mise en retraite du Pasteur Emmanuel Bayeka, le 20 décembre 2026 à 12h00, Assemblée de Kotto Bonamoussadi."},"hero":{"inv":"Vous êtes invités","title":"Culte de mise en retraite","lead":"du Pasteur Emmanuel Bayeka, serviteur de Dieu dans la Mission du Plein Évangile au Cameroun.","the":"The","name":"BAYEKA’s","fam":"FAMILY","cd":"2026-12-20T12:00:00+01:00","mono":"The BAYEKA’s"},"event":{"kick":"Détails de l’événement","title":"Une journée d’action de grâce","day":"20","dateText":"Dimanche 20 décembre 2026","time":"12h00","place":"Assemblée de Kotto Bonamoussadi","note":"(Collège Pilote)","cl":"Contacts","contacts":[{"tel":"676 370 337"},{"tel":"699 170 655"}],"honor":"Votre présence nous honorerait."},"journey":{"kick":"Son parcours","title":"Au service du Seigneur dans la Mission du Plein Évangile","note":"29 ans de service","steps":[{"icon":"b","tag":"1995 - 1997","title":"Appel et formation","text":"En septembre 1995, la famille BAYEKA quitte tout pour l’Institut Biblique du Plein Évangile (IBPE), à quatre, y compris leurs deux filles. Pendant deux ans, un frère au grand cœur prend en charge la pension, soutenu par l’assemblée locale, des bien-aimés et les familles. La formation s’achève dans la reconnaissance : le pasteur sort troisième de sa promotion, sous le regard du pionnier de la Mission du Plein Évangile. Le foyer est prêt pour la mission."},{"icon":"c","tag":"1997 - 2001","title":"Première station : Yabassi","text":"Au sortir de Bamenda, c’est l’accueil chaleureux d’une petite assemblée nichée au flanc de la rivière Batika, située derrière le lycée technique de Yabassi. Un peuple simple, (constitué de personnes qui vivent pour la plupart des produits des champs et de la pêche, mais aussi de quelques et étudiants) entoure la nouvelle famille pastorale. Pour cette famille de la ville, les difficultés commencent : l’immaturité dans le ministère, une vie rurale loin de Douala, et des attaques spirituelles qui laisseront des traces chez leurs enfants. L’autel de prière, renforcé par celui de l’ancien principal, devient le refuge de la famille, et le Seigneur accorde la victoire. Le foyer était entré à quatre, il ressort à cinq, avec une belle petite fille et laisse aussi un terrain de 1000 m2 acquit pour l'église, auquel on a donné le nom de ''Mont Morijah''. Ils gardent en mémoire des personnes telles que Me ESSAMA Oscarine, le feu ancien BANKONG, l’ancien EPOUPA, Mme SAFANA et tant d’autres, comme figures d'un souvenir impérissable de cette assemblée qui fut leur première station."},{"icon":"g","tag":"2001 - 2003","title":"Deuxième station : Nyalla","text":"Un déménagement par pirogue, des berges du Nkam à celles du Wouri, faute de véhicule sur la route, ramène la famille à Douala et à l’atmosphère urbaine qu’elle connaît bien. L’église, implantée par le MINEVA du patriarche évangéliste Samuel C. MAHOP, se réunit dans le salon d’une maison offerte temporairement par un frère, le pasteur occupant les autres pièces. Pendant deux semaines, des tensions obligent même la famille à loger dans l’église, avant que les responsables trouvent un local dans le quartier. Trois mois plus tard, le conflit est réglé et l’on regagne le presbytère. La communauté, petite mais marquée par l’amour, compte une jeunesse dévouée et des femmes dynamiques. Le séjour est beau et prometteur. Pourtant, en pleine recherche d'un terrain pour la délocalisation de  l’église, le pasteur reçoit une nouvelle affectation."},{"icon":"c","tag":"2003 - 2008","title":"Troisième station : Akwa","text":"Ils retournent servir dans l’église qui les avait envoyés en mission et où ils avaient connu le Seigneur. L’adaptation est facile, mais les premiers défis ne se font pas attendre : aux grandes églises, les grands défis. Le pasteur BAYEKA arrive comme pasteur assistant aux cotés du pasteur pionnier et du superviseur régional remplacé quelques années par un superviseur de district qui sera pourtant rappelé au prêt de Dieu. Dans ces circonstances, le pasteur BAYEKA est d'abord pasteur principal, puis pasteur assistant lorsqu'on en vient à remplacer le défunt superviseur de District. Cependant, le pasteur BAYEKA se trouve en ballotage lorsqu'un autre jeune pasteur nouvellement sortit de l'IFBE est affecté dans la même assemblée; il lui devient alors impossible d’établir une vision de ministère qui lui soit propre. Cette situation est particulièrement difficile à vivre et engendre même quelques conflits au sein du leadership. Bien soutenus par l’expérience de trois pasteurs supérieurs qui se succèdent, il reçoit aussi une formation épicée qui le rend capable de gérer ceux que Dieu lui confiera par la suite."},{"icon":"c","tag":"2008 - 2014","title":"Quatrième station : PK 14 Bassa","text":"C’est encore un point de prêche, mais ils y vont pour l’avancement du Royaume. La situation financière est modeste : le pasteur BAYEKA doit faire des travaux champêtres pour avoir une vie assez modeste. Grâce au dynamisme de l’église, et en particulier de ses dirigeants dont l’ancien Raymond DISSAKE, il érige une église/tabernacle. C’est dans cette église que lui sont confiées les responsabilités de pasteur de zone, d’administrateur régional du Grand Littoral. Il est aussi recruté entant qu'enseignant et Doyen académique  à la Bible Training Institute for Ministry (BTIM) La famille sort de cette période au nombre de huit, comme Noé, et avec leur première voiture. "},{"icon":"a","tag":"2014 - 2017","title":"Cinquième station : Nkolbisson","text":"Une autre page s'ouvre dans cette cité capitale ou il est affecté entant que superviseur de District de Yaoundé 1. Nkolbisson, une assemblée assise du point de vue leadership et structurel, accueille  la nouvelle famille pastorale avec beaucoup d'enthousiasme. Toujours dans l'optique de l'œuvre une nouvelle église est implantée dans le quartier Leboudi. Soutenu puissamment dans son ministère par l'actuel secrétaire général  de la mission du plein évangile le révérend AMBADIANG Télésphore alors Superviseur de la région du centre 1, le pasteur BAYEKA et sa famille font leurs valises pour une nouvelle destination après avoir reçu de nouveau la tâche d'administrateur régional mais cette fois ci, dans la Région du Centre 1."},{"icon":"d","tag":"2017 - 2021","title":"Sixième station : Montée Kondengui","text":"Une belle expérience : une église bâtie, un presbytère, et même des maisons en location. Tout va bien par sa grâce, avec une bonne collaboration avec le second couple pastoral, les leaders et les membres de l’église. Des moments difficile surviennent à l'occasion de la pandémie de Covid-19 ou le pasteur BAYEKA son épouse et l'une de leurs fille furent contaminés, mais le Seigneur manifesta sa victoire. Une promotion suit, tant bien que mal, et ils disent merci en toute chose. En 2021, l’affectation tombe de manière brusque, le pasteur BAYEKA et sa femme son pressés par le départ, il n'ont donc pas d'autre choix que d'accepter le démembrement de leur famille pour pourvoir poursuivre l'œuvre du ministère sans pour autant négliger l'avenir de leurs enfants mais la grâce de celui qui les appelé est suffisante pour eux."},{"icon":"a","tag":"2021 - 2023","title":"Septième station : Cow-fence (Limbe)","text":"Désormais en zone anglophone comme vice-superviseur régional du Sud - Ouest 3 : une autre langue, une autre culture, mais le même Dieu. Par la grâce de Dieu ces défis furent relevés tant bien que mal."},{"icon":"e","tag":"2023 - 2026","title":"Huitième station : Montée Lycée (Douala)","text":"Le pasteur BAYEKA arrive à Douala entant que superviseur du District du WOURI 4 et Vice - Superviseur de la région du Littoral 2 aux cotés du révérend Philipe Guillaume MINYEM. Basé dans l'assemblée de Bépanda Montée Lycée, c'est ici que nait la véritable impression d'un départ imminent en retraite dont le leadership en fit sien la réalité. La maturité et la stabilité de l'église permettent au pasteur BAYEKA d'orienter son ministère sur 3  axes principaux : La consolidation des acquis (pastorat quotidien), renforcement des capacités du leadership et un accent particulier sur la prière. Tous ceci en droite ligne avec la vision de la mission. Pour la famille pastorale, cette dernière assemblée dans leur parcours fut véritablement une porte de sortie privilégiée."}]},"words":{"kick":"Nos mots","titleA":"Ce que nous","titleEm":"disons","items":[{"q":"Son maître lui dit : C’est bien, bon et fidèle serviteur ; tu as été fidèle en peu de chose, je te confierai beaucoup ; entre dans la joie de ton maître.","who":"Matthieu 25:21","when":"Verset"},{"q":"J’ai combattu le bon combat, j’ai achevé la course, j’ai gardé la foi.","who":"2 Timothée 4:7","when":"Verset"},{"q":"Que la grâce du seigneur qui nous accompagnée et soutenu pendant tout notre ministère au sein de la Mission du Plein Evangile vous accompagne tout au long de vôtre vie . Mettez votre foi en Dieu et il ne vous délaissera pas. \nvos frères dans le seigneur","who":"La famille Bayeka","when":"Maranatha"},{"q":"Ecouter ce morceau qui nous tiens a coeur","who":"Frank Edwards","when":"Grace that found me"},{"q":"Ecouter ce morceau qui nous tiens a coeur","who":"Mercy Chinwo","when":"Amara Onyewem (je sais a qui j'appartiens)"}]},"place":{"kick":"Lieu & plan","titleA":"Une adresse, ","titleEm":"Kotto Bonamoussadi","sub":"Ouvrez l’itinéraire directement depuis votre position.","address":"Kotto, Bonamoussadi · Douala","query":"Collège Pilote Kotto Bonamoussadi Douala"},"footer":{"brand":"The BAYEKA’s Family","text":"Culte de mise en retraite · 20 décembre 2026"},"invite":{"gti":"Bienvenue","gtx":"Veuillez saisir votre nom pour ouvrir cette invitation.","ph":"Votre nom","btn":"Entrer","skip":"","hello":"Cher(e)","hello0":"Chers invités,","chg":"Ce n’est pas vous ?","msg":"C’est avec une grande joie, et le cœur rempli de reconnaissance envers Dieu, que la famille Bayeka vous invite au culte de mise en retraite du Pasteur Emmanuel Bayeka, serviteur de Dieu dans la Mission du Plein Évangile au Cameroun. Après tant d’années d'humble service du Seigneur, ce jour sera un temps de reconnaissance, de souvenirs et de bénédiction. Votre présence nous honorerait profondément : venez partager ce moment avec nous."},"rsvp":{"btn":"Confirmer par e-mail","subj":"Confirmation de présence — Culte de mise en retraite du Pasteur Emmanuel Bayeka","body":"Bonjour, je m’appelle {nom}. Je confirme ma présence au culte de mise en retraite du Pasteur Emmanuel Bayeka, le dimanche 20 décembre 2026 à 12h00, Assemblée de Kotto Bonamoussadi (Collège Pilote), Douala.","to":"gbayekalouange@gmail.com"},"en":{"meta":{"title":"Retirement Thanksgiving Service — Pastor Emmanuel Bayeka","desc":"Retirement thanksgiving service of Pastor Emmanuel Bayeka, 20 December 2026 at 12:00, Kotto Bonamoussadi Assembly."},"hero":{"inv":"You are invited","title":"Retirement Thanksgiving Service","lead":"honouring Pastor Emmanuel Bayeka, servant of God in the Full Gospel Mission in Cameroon.","the":"The","name":"BAYEKA’s","fam":"FAMILY","cd":"2026-12-20T12:00:00+01:00","mono":"The BAYEKA’s"},"event":{"kick":"Event details","title":"A day of thanksgiving","day":"20","dateText":"Sunday 20 December 2026","time":"12:00","place":"Kotto Bonamoussadi Assembly","note":"(Collège Pilote)","cl":"Contacts","contacts":[{"tel":"676 370 337"},{"tel":"699 170 655"}],"honor":"Your presence would honour us."},"journey":{"kick":"His journey","title":"In service of the Full Gospel Mission","note":"29 years of service","steps":[{"icon":"b","tag":"1995 - 1997","title":"Call and training","text":"In September 1995, the BAYEKA family gave up everything for the Full Gospel Bible Institute (IBPE), just the four of them, including their two daughters. For two years, a big-hearted brother took care of their board, supported by the local church, loved ones, and families. The training ended in recognition: the pastor graduated third in his class, under the watchful eye of the pioneer of the Full Gospel Mission. Their home was ready for the mission."},{"icon":"c","tag":"1997 - 2001","title":"First station: Yabassi","text":"Coming out of Bamenda, it’s the warm welcome of a small congregation nestled on the banks of the Batika River, located behind the technical high school of Yabassi. A simple people, (mostly living off farming and fishing, but also some students) surround the new pastoral family. For this city family, the difficulties begin: inexperience in ministry, a rural life far from Douala, and spiritual attacks that will leave marks on their children. The prayer altar, reinforced by that of the former principal, becomes the family’s refuge, and the Lord grants victory. The home started with four, and it leaves with five, with a beautiful little girl, and also a 1000 m² plot acquired for the church, named ''Mount Morijah''. They keep in mind people like Me ESSAMA Oscarine, the late elder BANKONG, the elder EPOUPA, Mme SAFANA, and many others, as figures of an unforgettable memory of this assembly that was their first stqtion."},{"icon":"g","tag":"2001 - 2003","title":"Second station: Nyalla","text":"A move by canoe, from the banks of the Nkam to those of the Wouri, due to the lack of a vehicle on the road, brings the family back to Douala and the urban atmosphere they know well. The church, established by the MINEVA of Patriarch Evangelist Samuel C. MAHOP, meets in the living room of a house temporarily offered by a brother, with the pastor occupying the other rooms. For two weeks, tensions even force the family to stay in the church, before the leaders find a place in the neighborhood. Three months later, the conflict is resolved, and they return to the rectory. The community, small but full of love, has devoted youth and dynamic women. The stay is beautiful and promising. Yet, while searching for land to relocate the church, the pastor receives a new assignment."},{"icon":"c","tag":"2003 - 2008","title":"Third station: Akwa","text":"They return to serve in the church that had sent them on a mission and where they had come to know the Lord. The adjustment is easy, but the first challenges come quickly: big churches, big challenges. Pastor BAYEKA arrives as an assistant pastor alongside the pioneering pastor and the area supervisor, who was replaced after a few years by a district supervisor who would soon be recalled to God. In these circumstances, Pastor BAYEKA is first the senior pastor, then assistant pastor when it comes time to replace the late district supervisor. However, Pastor BAYEKA finds himself in a tricky spot when another young pastor, newly graduated from IFBE, is assigned to the same congregation; it then becomes impossible for him to establish a ministry vision of his own. This situation is particularly hard to go through and even causes some conflicts within the leadership. Well supported by the experience of three senior pastors who take turns, he also gets some intense training that makes him capable of handling those God will entrust to him later."},{"icon":"c","tag":"2008 - 2014","title":"Fourth station: PK 14 Bassa","text":"It's another preaching point, but they go there for the advancement of the Kingdom. The financial situation is modest: Pastor BAYEKA has to do fieldwork to have a fairly modest life. Thanks to the dynamism of the church, and particularly its leaders including the elder Raymond DISSAKE, he builds a church/tabernacle. It is in this church that he is entrusted with the responsibilities of zone pastor and area administrator of the Grand Littoral. He is also recruited as a teacher and Academic Dean at the Bible Training Institute for Ministry (BTIM). The family comes out of this period with eight members, like Noah, and with their first car."},{"icon":"a","tag":"2014 - 2017","title":"Fifth station: Nkolbisson","text":"Another chapter opens in this capital city where he is assigned as the supervisor of the Yaoundé 1 district. Nkolbisson, a congregation strong in leadership and structure, warmly welcomes the new pastoral family with much enthusiasm. Still focused on the work, a new church is established in the Leboudi neighborhood. Strongly supported in his ministry by the current Secretary-General of the Full Gospel Mission, Reverend AMBADIANG Télésphore, who was then Supervisor of the Central Region 1, Pastor BAYEKA and his family pack their bags for a new destination after once again receiving the task of regional administrator, this time in the Central Area 1."},{"icon":"d","tag":"2017 - 2021","title":"Sixth station: Montée Kondengui","text":"A wonderful experience: a church built, a parsonage, and even rental houses. Everything goes well by His grace, with good collaboration with the second pastoral couple, the leaders, and the church members. Difficult moments arose during the Covid-19 pandemic when Pastor BAYEKA, his wife, and one of their daughters were infected, but the Lord showed His victory. A promotion followed, more or less successfully, and they gave thanks in all things. In 2021, the assignment came suddenly, and Pastor BAYEKA and his wife were rushed to leave, so they had no choice but to accept the separation of their family in order to continue the ministry work without neglecting their children's future, but the grace of the One who called them is sufficient for them."},{"icon":"a","tag":"2021 - 2023","title":"Seventh station: Cow-fence","text":"Now in an English-speaking area as the vice area supervisor of South-West 3: a different language, a different culture, but the same God. By the grace of God, these challenges were met, more or less."},{"icon":"e","tag":"2023 - 2026","title":"Eighth station: Montée Lycée","text":"Pastor BAYEKA arrives in Douala as the supervisor of the WOURI 4 District and Vice-Supervisor of the Littoral 2 area alongside Reverend Philipe Guillaume MINYEM. Based in the Bépanda Montée Lycée assembly, this is where the real sense of an imminent retirement begins, with leadership making it a reality. The church's maturity and stability allow Pastor BAYEKA to focus his ministry on three main areas: consolidating achievements (daily pastoral work), strengthening leadership capacities, and putting a special emphasis on prayer. All of this aligns perfectly with the mission's vision. For the pastoral family, this last assembly in their journey was truly a privileged way out."}]},"words":{"kick":"Our words","titleA":"What has ","titleEm":"carried us","items":[{"q":"His master said to him, ‘Well done, good and faithful servant. You have been faithful over a little; I will set you over much. Enter into the joy of your master.’","who":"Matthew 25:21","when":"Scripture"},{"q":"I have fought the good fight, I have finished the race, I have kept the faith.","who":"2 Timothy 4:7","when":"Scripture"},{"q":"May the grace of the Lord, which has accompanied and sustained us throughout our entire ministry, be with you all your life long. Place your faith in God, and He will never disappoint you.\nYour brethren  in the Lord","who":"The Bayeka family","when":"Maranatha"}]},"place":{"kick":"Venue & map","titleA":"One address, ","titleEm":"Kotto Bonamoussadi","sub":"Open directions from where you are.","address":"Kotto, Bonamoussadi · Douala","query":"Collège Pilote Kotto Bonamoussadi Douala"},"footer":{"brand":"The BAYEKA’s Family","text":"Retirement Thanksgiving Service · 20 December 2026"},"invite":{"gti":"Welcome","gtx":"Please enter your name to open this invitation.","ph":"Your name","btn":"Enter","skip":"","hello":"Dear","hello0":"Dear guests,","chg":"Not you?","msg":"It is with great joy, and hearts full of gratitude to God, that the Bayeka family invites you to the retirement thanksgiving service of Pastor Emmanuel Bayeka, servant of God in the Full Gospel Mission in Cameroon. After so many years of humble service to the Lord, this day will be a time of thanksgiving, remembrance and blessing. Your presence would honour us deeply — come and share this moment with us."},"rsvp":{"btn":"Confirm by email","subj":"RSVP — Retirement service of Pastor Emmanuel Bayeka","body":"Hello, my name is {nom}. I confirm my attendance at the retirement thanksgiving service of Pastor Emmanuel Bayeka, on Sunday 20 December 2026 at 12:00, Kotto Bonamoussadi Assembly (Collège Pilote), Douala."}},"photo":"data:image/webp;base64,UklGRgAKAQBXRUJQVlA4WAoAAAAQAAAA2wIA2wUAQUxQSMppAAANr8K4bRtJkJz+y5tm7tnd11YQEdn4Wr0WyUKQFf5wZ4dVW7IQcIs7OyJLtt24jeo+QBDgJPtfsDhATA+/Ef2fAP4rw1ekV2zkEwMi+mqA58DsQfhbpJbIPKJqQlfZhK3skbR0XTN0giRNbrX4rGyHu4WZBNSKWYvZmlaqxRbqkQtmHTYzs4f7qKxncUKO9HxD0uAeZS5Zg/uIUUTEQjXg7g+rAURETLIDdwczm0BE+KBacHdbg8iBenBjO/ON1hRcdVCCdA7H6ayfw/IwjrvqLJ1lh9XPYddZljoqr7Ok0+okPY/K66xv/dHypNK3DtJhqcPyLPRvQVP1ZXbEC9FREdWhGvie8lYbHnWKHtSWCnsD2xJIfbEQK9WnnChXPn3fC7WQ6qOFjuuw3NFbMakNVZe2LltSnyafkR7ZUBuqWlLu5SRHkoCfGl17nx5ppL2caFJL3lBbWuKNBO7XQjMBZL7kNcmBrtqINnJQj68F7aRmeqQkcPfRzxY2uepxDXD3AblVE+khjzTA3Ue5kxMG5XAngPtDtlOzBL4e5GcgoHZCMwEpAXgEpMC32NCIAEyAk2/cNVru0sAa7o2a1UMN2tBZWTMBarhrrWZkQtUe2eURmDV4ABEDM5u9G5CUHQMEjDiQJEmO23AwXZrG/58MYgCv54iYgOdn4lRV2anjIUkgdxURAbF6NmMd46Xc1AovcWLQ4q2kiEiBJLkRa0kSYMU692JotQQ0Znpb8NxlXHquff5rGpd8q0beecbszO4YbnYSOl2A3A7PfVVVREQCYxxI0gIHa8K88mE9yyvAB5BUV6pq3qpdRMR8yYiI3G4SLEm9BMuUoBesIu1ewpyznLYvvLe4IUluy5YUi/LQrx4kSXIk2bYtFbOIqF4NNhrGnv+UMIbndGWEmR4wgUV6QEXEBPiWJMmSJMm2iETNPfr2Nv//h/NU94gwE57Lc3G8RsQEeBIASZIkSZIAEImZJfb1/w+M0x6qzEyIEPsC6A+IiAnAbdu2a7eNxpx7nwuAztn//2mVczmwJOCes9Z8uAAriW2ZfoqICfBt23bbRtu2zbkWQFKSq+rJ4X3f3ff8T+rJoaItkQTWmm+OAtTq2oqICfAtSZIlSYxtqZq5R2RVN+54mv//OdwxM92VmRFupnOfAYUG0TxGxAT4liTJkiTJtohFzTyiLtCP/f8fWZeMMFPmvk2YSELMe0RMgG9JkixJkmyLiDWy//93BzpMeG6PxdmvETEBmrVtb9togt73A8AgyXblzj057mY157+dY8gd/tBVZZdlBZIAvndRyWVpRmjPJiImwLckSZYkSbZFJGpRl///1b67qfBD9mtkceVTREzAL/Xh/w//f/j/w/8f/v/w/4f/P/z/4f8P/3/4/8P//2en8j8RqfVXYRGWGpKEKI4h4q+4qc9oEcedhEo6yeU4Ro5AABLiH6xkiNYB5MqZitqAQrqjRRpI6BYJ+4NVimYwYJ6rOxFm4ZUlkSS40hS5t967VP4gRVqMgfS6
